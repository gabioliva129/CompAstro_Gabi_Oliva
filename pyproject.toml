[project]
name = "comp-astro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabrielle Oliva", email = "gabrielle.oliva55@gc.cuny.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
comp-astro = "comp_astro:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
